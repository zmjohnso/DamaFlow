name: Release

# Builds a signed, minified, real-device-only release APK and publishes it
# as a GitHub Release with the APK attached (what Obtainium tracks). Trigger
# by pushing a tag like `v1.2.3`, or run manually against an existing tag.
#
# Requires these repo secrets (see CLAUDE.md for how they were generated):
#   DAMAFLOW_RELEASE_KEYSTORE_BASE64
#   DAMAFLOW_RELEASE_STORE_PASSWORD
#   DAMAFLOW_RELEASE_KEY_ALIAS
#   DAMAFLOW_RELEASE_KEY_PASSWORD

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v1.2.3"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$TAG' is not in vX.Y.Z format" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${MAJOR}.${MINOR}.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "code=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Generate native Android project
        run: npx expo prebuild --platform android
        # android/ is gitignored (Continuous Native Generation) — this regenerates it from
        # app.json + config plugins, including plugins/withReleaseConfig.js which wires up
        # release signing and version overrides. See CLAUDE.md's Release Process section.

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DAMAFLOW_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "DAMAFLOW_RELEASE_KEYSTORE_BASE64 secret is not set — see CLAUDE.md." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/damaflow-release.keystore"

      - name: Build signed release APK
        env:
          DAMAFLOW_RELEASE_STORE_FILE: ${{ runner.temp }}/damaflow-release.keystore
          DAMAFLOW_RELEASE_STORE_PASSWORD: ${{ secrets.DAMAFLOW_RELEASE_STORE_PASSWORD }}
          DAMAFLOW_RELEASE_KEY_ALIAS: ${{ secrets.DAMAFLOW_RELEASE_KEY_ALIAS }}
          DAMAFLOW_RELEASE_KEY_PASSWORD: ${{ secrets.DAMAFLOW_RELEASE_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew assembleRelease \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a \
            -Pandroid.versionCode=${{ steps.version.outputs.code }} \
            -Pandroid.versionName=${{ steps.version.outputs.name }}

      - name: Rename artifact and check size budget (NFR5, 50MB)
        id: artifact
        run: |
          SRC="android/app/build/outputs/apk/release/app-release.apk"
          OUT="damaflow-${{ steps.version.outputs.tag }}.apk"
          mv "$SRC" "$OUT"
          shasum -a 256 "$OUT" > "$OUT.sha256"
          SIZE_MB=$(( $(stat -c%s "$OUT" 2>/dev/null || stat -f%z "$OUT") / 1024 / 1024 ))
          echo "APK size: ${SIZE_MB}MB"
          if [ "$SIZE_MB" -gt 55 ]; then
            echo "APK is ${SIZE_MB}MB, over the 50MB budget (NFR5) plus a 5MB margin." >&2
            exit 1
          fi
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "checksum=$OUT.sha256" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.artifact.outputs.apk }}" \
            "${{ steps.artifact.outputs.checksum }}" \
            --title "DamaFlow ${{ steps.version.outputs.name }}" \
            --generate-notes
